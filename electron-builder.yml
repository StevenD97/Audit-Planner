appId: com.audit-planner.app
productName: Audit Planner
directories:
  output: release
# No auto-update server exists for this app; disable electron-builder's
# publish/update-info generation entirely rather than leaving it half
# configured against a repository that isn't set up for it.
publish: null
files:
  - out/**/*
  - package.json
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.business
linux:
  target: AppImage
  category: Office
# No custom icon is bundled in this build (none was supplied); electron-builder
# falls back to its default icon. Add build/icon.{ico,icns,png} and an `icon:`
# entry per platform above when branding assets are available — see
# docs/ROADMAP.md "Post-MVP roadmap".
